name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-typecheck:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: nodewave_assessment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:admin@localhost:5432/nodewave_assessment?schema=public"
      JWT_SECRET: "ci-secret-jwt-key-2026-test"
      PORT: 5000

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Generate Prisma Client & Push DB Schema
        run: bun x prisma db push --skip-generate=false

      - name: Seed Database
        run: bun prisma/seed.ts

      - name: Run Unit Tests
        run: bun test

      - name: Run TypeScript Typecheck
        run: bun run typecheck

